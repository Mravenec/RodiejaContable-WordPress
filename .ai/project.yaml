harness: mariadb-wordpress-php-plugins
module_name: workshop-ledger
php_version: "8.3"
wordpress_requires: "6.4"
native_only: true
native_first: true
custom_requires_human_ok: true
layout: unified-wordpress
docroot: web
plugin_path: web/wp-content/plugins/workshop-ledger
mu_plugin_path: web/wp-content/mu-plugins/harness-hardening.php
product: WorkshopLedger
forbidden_packages:
  - illuminate/*
  - laravel/*
  - doctrine/*
  - symfony/framework-bundle
services_without_repository:
  - HealthService
  - DemoSeedService
  - DomainStatsService
  - FinanceTotalsService
  - AudatexInsSettingsService
  - CostaRicaCantonesService
  - CsvExportService
  - DomainExportService
  - DomainImportService
  - ExecutiveDashboardService
  - HistorialRecorder
  - InventoryReportService
  - MonthlyResumenService
  - PedidoImportService
  - ProfitabilityReportService
  - SalesReportService
security:
  disallow_file_edit: true
  rest_public_routes_allowlist:
    - workshop-ledger/v1/health
  require_capability_on_mutations: true
