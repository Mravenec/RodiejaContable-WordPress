# Deny PHP execution in uploads (common malware drop path).
location ~* ^/wp-content/uploads/.*\.(?:php|phtml|phar|php[0-9]?)$ {
    deny all;
}

# Block sensitive files that must never be web-reachable.
location ~* /\.(?:git|env|htaccess|htpasswd|svn|DS_Store) {
    deny all;
}

location ~* /(?:composer\.(?:json|lock)|package(?:-lock)?\.json|yarn\.lock|phpunit\.xml(?:\.dist)?)$ {
    deny all;
}

location ~* /(?:readme|changelog|license|security)\.(?:md|txt)$ {
    deny all;
}

# Reduce fingerprinting of common backup / dump leftovers.
location ~* \.(?:sql|bak|old|swp|orig|save|dist)$ {
    deny all;
}
